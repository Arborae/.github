name: 🐛 Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill in the fields below: more details = faster fix.

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Provide a version, tag or commit SHA
      placeholder: "v0.8.1 / 256e054"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Backend/API
        - Docker/Deploy
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is not working?
      placeholder: "When I do ..., I expect ..., instead ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps clearly
      placeholder: |
        1) ...
        2) ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: "It should ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs (remove tokens and sensitive data)
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for similar open issues
          required: true
        - label: I removed credentials/tokens from logs
          required: true
