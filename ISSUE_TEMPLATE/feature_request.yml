name: ✨ Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Well-explained ideas = faster implementations. Thanks!

  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      placeholder: "I'm trying to ..., but ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: "I would like ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "I also thought about ..."
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Small (nice-to-have)
        - Medium
        - High (blocks a workflow)
    validations:
      required: true
